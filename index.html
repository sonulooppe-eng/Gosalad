<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Salad — Crave Fresh. Live Healthy.</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="site-wrapper">
    <!-- Header / Navbar -->
    <header class="navbar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="#4d7c3b">
          <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A9.49 9.49 0 0 0 17 8z"/>
          <path d="M10.2 12a10.87 10.87 0 0 1 8.8-8c0 6-3.8 11.2-8.8 8z" opacity="0.6"/>
        </svg>
        <span>Go Salad</span>
      </div>

      <nav class="nav-links">
        <a href="#story">OUR STORY</a>
        <a href="#menu">MENU</a>
        <a href="#customize">CUSTOMIZE</a>
      </nav>

      <div class="nav-actions">
        <button class="btn btn-order" onclick="openCheckout()">ORDER NOW</button>
        <button class="cart-btn" onclick="openCartModal()">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2b3a29" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <!-- Hero Section with Background Banner -->
    <section class="hero-section">
      <div class="hero-content">
        <h1>CRAVE FRESH.<br>LIVE HEALTHY.</h1>
        <p>Salad specializing in healthy, fresh, artisanal salad bowls.</p>
        <a href="#menu" class="btn btn-hero">VIEW MENU</a>
      </div>

      <!-- Carousel Navigation Arrows -->
      <button class="slider-btn prev-btn">&#10094;</button>
      <button class="slider-btn next-btn">&#10095;</button>
    </section>

    <!-- Wave / Curved Mask Divider -->
    <div class="wave-divider"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Section Title & View Cart Button -->
      <div class="section-title-bar">
        <h2>OUR POPULAR BOWLS</h2>
        <button class="btn btn-view-cart" onclick="openCartModal()">VIEW TO CART</button>
      </div>

      <div class="content-layout">
        <!-- Vertical Feature Sidebar -->
        <aside class="features-sidebar">
          <div class="feature-badge">
            <span class="f-icon">🍃</span>
            <span>Leaf</span>
          </div>
          <div class="feature-badge">
            <span class="f-icon">✨</span>
            <span>Fresh</span>
          </div>
          <div class="feature-badge">
            <span class="f-icon">⏱️</span>
            <span>Fast</span>
          </div>
        </aside>

        <!-- Product Cards Grid -->
        <section class="bowls-grid" id="bowlsGrid">
          <!-- Populated by script.js -->
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
