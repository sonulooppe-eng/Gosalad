<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      
      .brand-go {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-size: 145px;
        font-weight: 900;
        fill: #264b46;
        letter-spacing: -2px;
      }
      .brand-salad {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-size: 145px;
        font-weight: 900;
        fill: #61b138;
        letter-spacing: -2px;
      }
      .brand-tagline {
        font-family: 'Montserrat', sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #5eaa38;
        letter-spacing: 16px;
      }
      .badge-title {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-size: 36px;
        font-weight: 900;
        fill: #1b6833;
        letter-spacing: -0.5px;
      }
      .badge-tagline {
        font-family: 'Montserrat', sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #2d342d;
        letter-spacing: 2.8px;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fc44e"/>
      <stop offset="60%" stop-color="#469b2d"/>
      <stop offset="100%" stop-color="#2a721c"/>
    </linearGradient>

    <linearGradient id="bowlHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Tomato Slice -->
    <g id="tomatoSlice">
      <circle cx="0" cy="0" r="50" fill="#e52924"/>
      <circle cx="0" cy="0" r="42" fill="#c41a15"/>
      <path d="M0,0 M-28,-10 C-36,-2 0,0 0,0 M0,0 C0,0 -2,-36 10,-28 M0,0 C0,0 36,-2 28,10 M0,0 C0,0 2,36 -10,28" stroke="#e52924" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="0" r="10" fill="#e52924"/>
      <path d="M-12,-15 C-25,-30 -30,-5 -15,-5 Z" fill="#7a0d0a"/>
      <circle cx="-20" cy="-14" r="3.5" fill="#fbd043"/>
      <circle cx="-16" cy="-20" r="3" fill="#fbd043"/>
      <path d="M15,-12 C30,-25 5,-30 5,-15 Z" fill="#7a0d0a"/>
      <circle cx="14" cy="-20" r="3.5" fill="#fbd043"/>
      <circle cx="20" cy="-16" r="3" fill="#fbd043"/>
      <path d="M12,15 C25,30 30,5 15,5 Z" fill="#7a0d0a"/>
      <circle cx="20" cy="14" r="3.5" fill="#fbd043"/>
      <circle cx="16" cy="20" r="3" fill="#fbd043"/>
      <path d="M-15,12 C-30,25 -5,30 -5,15 Z" fill="#7a0d0a"/>
      <circle cx="-14" cy="20" r="3.5" fill="#fbd043"/>
      <circle cx="-20" cy="16" r="3" fill="#fbd043"/>
    </g>

    <!-- Cucumber Slice -->
    <g id="cucumberSlice">
      <circle cx="0" cy="0" r="60" fill="#1b5c27"/>
      <circle cx="0" cy="0" r="54" fill="#88cf66"/>
      <circle cx="0" cy="0" r="46" fill="#c5eab2"/>
      <circle cx="0" cy="0" r="36" fill="#e1f7d5"/>
      <ellipse cx="0" cy="-20" rx="3.5" ry="9" fill="#9ecf86"/>
      <ellipse cx="14" cy="-14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(45 14 -14)"/>
      <ellipse cx="20" cy="0" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(90 20 0)"/>
      <ellipse cx="14" cy="14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(135 14 14)"/>
      <ellipse cx="0" cy="20" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(180 0 20)"/>
      <ellipse cx="-14" cy="14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(225 -14 14)"/>
      <ellipse cx="-20" cy="0" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(270 -20 0)"/>
      <ellipse cx="-14" cy="-14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(315 -14 -14)"/>
    </g>

    <!-- Onion Ring -->
    <g id="onionRing">
      <path d="M0,-45 A45,45 0 1,1 -0.01,-45 Z M0,-33 A33,33 0 1,0 0.01,-33 Z" fill="#89287a"/>
      <path d="M0,-33 A33,33 0 1,1 -0.01,-33 Z M0,-25 A25,25 0 1,0 0.01,-25 Z" fill="#ffffff" opacity="0.85"/>
    </g>
  </defs>

  <!-- ================= LEFT CIRCLE EMBLEM (ADDITIONAL 5% REDUCTION -> r: 141) ================= -->
  <g id="emblem" transform="translate(190, 200)">
    <!-- Outer Ring (r: 141) -->
    <circle cx="0" cy="0" r="141" fill="#ffffff" stroke="#488e35" stroke-width="9.5"/>
    <!-- Inner Ring (r: 131.6) -->
    <circle cx="0" cy="0" r="131.6" fill="#ffffff" stroke="#488e35" stroke-width="1.5"/>

    <!-- Scaled Salad Illustration -->
    <g transform="translate(0, -36) scale(0.274)">
      <!-- Background Leaves -->
      <path d="M-200,-50 C-260,-80 -270,-140 -220,-190 C-170,-240 -140,-170 -100,-130 C-130,-90 -160,-70 -200,-50 Z" fill="#3a8a30"/>
      <path d="M-140,-120 C-180,-190 -200,-230 -130,-260 C-60,-290 -70,-200 -50,-150 Z" fill="#3c8d2a"/>
      <path d="M-20,-130 C-40,-180 -90,-190 -60,-240 C-50,-260 -10,-250 -10,-230 C20,-240 20,-210 0,-190 C30,-180 10,-140 -20,-130 Z" fill="#529e31"/>
      <path d="M20,-140 C10,-190 40,-230 90,-240 C140,-250 140,-190 120,-150 Z" fill="#6dbd3f"/>
      <path d="M100,-100 C130,-150 190,-210 240,-160 C280,-120 240,-80 250,-40 C210,-30 180,-60 100,-100 Z" fill="#4d9b32"/>
      <path d="M180,-30 C230,-70 280,-100 310,-60 C340,-20 280,10 270,40 C230,50 200,10 180,-30 Z" fill="#5ea935"/>

      <!-- Mid-layer Vegetables -->
      <path d="M-220,-40 C-180,-150 -90,-160 -60,-60 C-110,-30 -170,-10 -220,-40 Z" fill="#58a735"/>
      <path d="M-120,-30 C-130,-80 -90,-100 -70,-90 C-40,-110 -20,-80 -40,-50 Z" fill="#75be3b"/>
      <path d="M60,-120 C70,-160 120,-190 145,-155 C155,-140 140,-120 130,-130 C115,-145 85,-135 80,-110 Z" fill="#f6ba22"/>

      <!-- Onion -->
      <g transform="translate(-30, -100) scale(0.95)">
        <use href="#onionRing"/>
        <circle cx="0" cy="0" r="16" fill="#4e7025"/>
        <circle cx="0" cy="0" r="7" fill="#ffffff"/>
      </g>

      <!-- Tomatoes -->
      <g transform="translate(65, -65) scale(0.85) rotate(15)">
        <use href="#tomatoSlice"/>
      </g>
      <g transform="translate(55, 25) scale(0.92) rotate(-5)">
        <use href="#tomatoSlice"/>
      </g>

      <!-- Cucumbers -->
      <g transform="translate(185, -70) scale(0.78) rotate(20)">
        <use href="#cucumberSlice"/>
      </g>
      <g transform="translate(160, -35) scale(0.82) rotate(10)">
        <use href="#cucumberSlice"/>
      </g>
      <g transform="translate(125, 5) scale(0.85) rotate(-5)">
        <use href="#cucumberSlice"/>
      </g>

      <!-- Carrot Spirals -->
      <path d="M-170,-65 C-170,-110 -130,-125 -110,-100 C-90,-75 -90,-35 -115,-25 C-140,-15 -170,-30 -170,-65 Z" fill="#f37324"/>
      <path d="M-195,-15 C-195,-60 -155,-70 -135,-45 C-115,-20 -120,15 -145,30 C-170,45 -195,25 -195,-15 Z" fill="#f88326"/>
      <path d="M-125,-45 C-110,-70 -75,-60 -60,-35 C-45,-10 -60,15 -90,15 C-115,15 -130,-10 -125,-45 Z" fill="#f88326"/>

      <!-- Front Greens -->
      <path d="M-80,5 C-50,-75 20,-60 0,20 C-35,50 -70,40 -80,5 Z" fill="#69b83b"/>
      <path d="M-120,20 C-100,-35 -40,-20 -55,45 C-85,70 -110,50 -120,20 Z" fill="#4d9b32"/>
      <path d="M140,30 C170,-15 220,10 205,50 C180,75 140,60 140,30 Z" fill="#69b83b"/>

      <!-- Bowl -->
      <ellipse cx="0" cy="0" rx="245" ry="38" fill="#32751e" opacity="0.3"/>
      <path d="M-240,-5 C-235,120 -135,215 0,215 C135,215 235,120 240,-5 C185,25 90,40 0,40 C-90,40 -185,25 -240,-5 Z" fill="url(#bowlGrad)"/>
      <path d="M-240,-5 C-235,120 -135,215 0,215 C-80,195 -170,120 -220,15 Z" fill="url(#bowlHighlight)"/>
      <path d="M-240,-5 C-180,25 -95,40 0,40 C95,40 180,25 240,-5 C225,8 125,48 0,48 C-125,48 -225,8 -240,-5 Z" fill="#a4e46a"/>
    </g>

    <!-- Badge Text -->
    <text x="0" y="58" class="badge-title" text-anchor="middle">GoSalad</text>
    <text x="0" y="79" class="badge-tagline" text-anchor="middle">pick mix go</text>

    <!-- Badge Colored Dots -->
    <circle cx="-15" cy="93" r="3.8" fill="#4d9b32"/>
    <circle cx="0" cy="93" r="3.8" fill="#f37324"/>
    <circle cx="15" cy="93" r="3.8" fill="#c41a15"/>
  </g>

  <!-- ================= RIGHT HORIZONTAL WORDMARK ================= -->
  <g id="brandTypography" transform="translate(425, 215)">
    <!-- "GoSalad" -->
    <text x="0" y="0">
      <tspan class="brand-go">Go</tspan><tspan class="brand-salad">Salad</tspan>
    </text>

    <!-- "PICK MIX GO" Tagline -->
    <text x="95" y="80" class="brand-tagline">PICK MIX GO</text>
  </g>
</svg>
