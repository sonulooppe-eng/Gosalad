<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      .brand-title { font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif; font-weight: 800; font-size: 30px; fill: #2A4A46; }
      .brand-tag { font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif; font-weight: 600; font-size: 11px; fill: #6DB342; letter-spacing: 3px; text-transform: uppercase; }
      .logo-circle { fill: #2A4A46; stroke: #6DB342; stroke-width: 2; }
      .bowl { fill: #F8F6EF; }
      .leaf-1 { fill: #6DB342; }
      .leaf-2 { fill: #4E9328; }
      .dot-1 { fill: #E65A41; }
      .dot-2 { fill: #F4A261; }
    </style>
  </defs>
  
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" class="logo-circle" />
    <path d="M18 34 C18 45, 46 45, 46 34 Z" class="bowl" />
    <path d="M21 30 C21 21, 32 21, 32 30 Z" class="leaf-1" />
    <path d="M30 27 C30 18, 43 18, 43 27 Z" class="leaf-2" />
    <circle cx="26" cy="31" r="2.5" class="dot-1" />
    <circle cx="37" cy="32" r="2" class="dot-2" />
    <path d="M12 32 A20 20 0 0 1 52 32" fill="none" stroke="#6DB342" stroke-width="1.5" stroke-dasharray="2 3" />
  </g>

  <text x="88" y="44" class="brand-title">Go<tspan fill="#6DB342">Salad</tspan></text>
  <text x="90" y="62" class="brand-tag">pick mix go</text>
</svg>
