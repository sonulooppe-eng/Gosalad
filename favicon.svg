<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <!-- Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fc44e"/>
      <stop offset="60%" stop-color="#469b2d"/>
      <stop offset="100%" stop-color="#2a721c"/>
    </linearGradient>

    <!-- Bowl Curved Highlight -->
    <linearGradient id="bowlHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Tomato Slice Component -->
    <g id="tomatoSlice">
      <circle cx="0" cy="0" r="50" fill="#e52924"/>
      <circle cx="0" cy="0" r="42" fill="#c41a15"/>
      <!-- Inner Meat Core -->
      <path d="M0,0 M-28,-10 C-36,-2 0,0 0,0 M0,0 C0,0 -2,-36 10,-28 M0,0 C0,0 36,-2 28,10 M0,0 C0,0 2,36 -10,28" stroke="#e52924" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="0" r="10" fill="#e52924"/>
      <!-- Seed Cavities & Seeds -->
      <path d="M-12,-15 C-25,-30 -30,-5 -15,-5 Z" fill="#7a0d0a"/>
      <circle cx="-20" cy="-14" r="3.5" fill="#fbd043"/>
      <circle cx="-16" cy="-20" r="3" fill="#fbd043"/>

      <path d="M15,-12 C30,-25 5,-30 5,-15 Z" fill="#7a0d0a"/>
      <circle cx="14" cy="-20" r="3.5" fill="#fbd043"/>
      <circle cx="20" cy="-16" r="3" fill="#fbd043"/>

      <path d="M12,15 C25,30 30,5 15,5 Z" fill="#7a0d0a"/>
      <circle cx="20" cy="14" r="3.5" fill="#fbd043"/>
      <circle cx="16" cy="20" r="3" fill="#fbd043"/>

      <path d="M-15,12 C-30,25 -5,30 -5,15 Z" fill="#7a0d0a"/>
      <circle cx="-14" cy="20" r="3.5" fill="#fbd043"/>
      <circle cx="-20" cy="16" r="3" fill="#fbd043"/>
    </g>

    <!-- Cucumber Slice Component -->
    <g id="cucumberSlice">
      <circle cx="0" cy="0" r="60" fill="#1b5c27"/>
      <circle cx="0" cy="0" r="54" fill="#88cf66"/>
      <circle cx="0" cy="0" r="46" fill="#c5eab2"/>
      <circle cx="0" cy="0" r="36" fill="#e1f7d5"/>
      <!-- Cucumber Seeds -->
      <ellipse cx="0" cy="-20" rx="3.5" ry="9" fill="#9ecf86"/>
      <ellipse cx="14" cy="-14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(45 14 -14)"/>
      <ellipse cx="20" cy="0" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(90 20 0)"/>
      <ellipse cx="14" cy="14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(135 14 14)"/>
      <ellipse cx="0" cy="20" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(180 0 20)"/>
      <ellipse cx="-14" cy="14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(225 -14 14)"/>
      <ellipse cx="-20" cy="0" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(270 -20 0)"/>
      <ellipse cx="-14" cy="-14" rx="3.5" ry="9" fill="#9ecf86" transform="rotate(315 -14 -14)"/>
    </g>

    <!-- Onion Ring Component -->
    <g id="onionRing">
      <path d="M0,-45 A45,45 0 1,1 -0.01,-45 Z M0,-33 A33,33 0 1,0 0.01,-33 Z" fill="#89287a"/>
      <path d="M0,-33 A33,33 0 1,1 -0.01,-33 Z M0,-25 A25,25 0 1,0 0.01,-25 Z" fill="#ffffff" opacity="0.85"/>
    </g>
  </defs>

  <!-- ================= SALAD BOWL ARTWORK ================= -->
  <g id="saladArtwork" transform="translate(-100, -50)">
    
    <!-- === BACKGROUND GREENS (LAYER 1) === -->
    <!-- Far Left Oak Leaf -->
    <path d="M300,320 C240,290 230,230 280,180 C330,130 360,200 400,240 C370,280 340,300 300,320 Z" fill="#3a8a30"/>
    <path d="M260,240 C240,210 270,180 300,190" fill="none" stroke="#52aa44" stroke-width="3"/>

    <!-- Left High Spinach Leaf -->
    <path d="M360,250 C320,180 300,140 370,110 C440,80 430,170 450,220 Z" fill="#3c8d2a"/>

    <!-- Center Arugula Leaf -->
    <path d="M480,240 C460,190 410,180 440,130 C450,110 490,120 490,140 C520,130 520,160 500,180 C530,190 510,230 480,240 Z" fill="#529e31"/>
    
    <!-- Top Center Light Green Leaves -->
    <path d="M520,230 C510,180 540,140 590,130 C640,120 640,180 620,220 Z" fill="#6dbd3f"/>
    <path d="M545,175 C575,150 610,155 615,185" fill="none" stroke="#8ee05d" stroke-width="3"/>

    <!-- Top Right Oak Leaf -->
    <path d="M600,270 C630,220 690,160 740,210 C780,250 740,290 750,330 C710,340 680,310 600,270 Z" fill="#4d9b32"/>

    <!-- Far Right Oak Leaf -->
    <path d="M680,340 C730,300 780,270 810,310 C840,350 780,380 770,410 C730,420 700,380 680,340 Z" fill="#5ea935"/>

    <!-- === MIDGROUND SALAD INGREDIENTS (LAYER 2) === -->

    <!-- Broad Romaine Leaf (Left Center) -->
    <path d="M280,330 C320,220 410,210 440,310 C390,340 330,360 280,330 Z" fill="#58a735"/>
    <path d="M310,300 Q360,250 410,280" fill="none" stroke="#7dd453" stroke-width="4"/>

    <!-- Curly Endive (Center Left) -->
    <path d="M380,340 C370,290 410,270 430,280 C460,260 480,290 460,320 Z" fill="#75be3b"/>

    <!-- Yellow Bell Pepper Strip (Top Right) -->
    <path d="M560,250 C570,210 620,180 645,215 C655,230 640,250 630,240 C615,225 585,235 580,260 Z" fill="#f6ba22"/>
    <path d="M580,255 C590,230 615,220 630,230" fill="none" stroke="#ffe066" stroke-width="2.5"/>

    <!-- Purple Red-Onion Ring with Inside Olive -->
    <g transform="translate(470, 270) scale(0.95)">
      <use href="#onionRing"/>
      <!-- Sliced Green Olive inside onion -->
      <circle cx="0" cy="0" r="16" fill="#4e7025"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    </g>

    <!-- Top Center Sliced Tomato -->
    <g transform="translate(565, 305) scale(0.85) rotate(15)">
      <use href="#tomatoSlice"/>
    </g>

    <!-- === CRISP VEGGIES & TOPPINGS (LAYER 3) === -->

    <!-- Cucumber Slices Stack (Right Side) -->
    <!-- Sliced Cucumber 1 (Back) -->
    <g transform="translate(685, 300) scale(0.78) rotate(20)">
      <use href="#cucumberSlice"/>
    </g>
    <!-- Sliced Cucumber 2 (Middle) -->
    <g transform="translate(660, 335) scale(0.82) rotate(10)">
      <use href="#cucumberSlice"/>
    </g>
    <!-- Sliced Cucumber 3 (Front) -->
    <g transform="translate(625, 375) scale(0.85) rotate(-5)">
      <use href="#cucumberSlice"/>
    </g>

    <!-- Carrot Spirals (Curled Ribbon on Left) -->
    <!-- Spiral Loop 1 (Top Left) -->
    <path d="M330,305 C330,260 370,245 390,270 C410,295 410,335 385,345 C360,355 330,340 330,305 Z" fill="#f37324"/>
    <path d="M345,305 C345,275 370,265 385,280 C400,295 395,325 380,330 C365,335 345,325 345,305 Z" fill="#ea5815"/>

    <!-- Spiral Loop 2 (Bottom Left Front) -->
    <path d="M305,355 C305,310 345,300 365,325 C385,350 380,385 355,400 C330,415 305,395 305,355 Z" fill="#f88326"/>
    <path d="M320,355 C320,330 345,320 360,335 C375,350 370,375 355,385 C340,395 320,380 320,355 Z" fill="#e65213"/>

    <!-- Spiral Loop 3 (Center Extension) -->
    <path d="M375,325 C390,300 425,310 440,335 C455,360 440,385 410,385 C385,385 370,360 375,325 Z" fill="#f88326"/>
    <path d="M390,335 C400,320 420,325 430,340 C440,355 430,370 410,370 C395,370 385,355 390,335 Z" fill="#e65213"/>

    <!-- Center Foreground Fresh Lettuce Leaves -->
    <path d="M420,375 C450,295 520,310 500,390 C465,420 430,410 420,375 Z" fill="#69b83b"/>
    <path d="M380,390 C400,335 460,350 445,415 C415,440 390,420 380,390 Z" fill="#4d9b32"/>
    <path d="M430,380 Q465,340 485,370" fill="none" stroke="#92e45e" stroke-width="3"/>

    <!-- Lower Foreground Sliced Tomato -->
    <g transform="translate(555, 395) scale(0.92) rotate(-5)">
      <use href="#tomatoSlice"/>
    </g>

    <!-- Foreground Right Greens Ruffles -->
    <path d="M640,400 C670,355 720,380 705,420 C680,445 640,430 640,400 Z" fill="#69b83b"/>

    <!-- === SALAD BOWL (FOREGROUND LAYER 4) === -->
    <!-- Bowl Back Inner Rim / Depth -->
    <ellipse cx="500" cy="370" rx="245" ry="38" fill="#32751e" opacity="0.3"/>

    <!-- Main Solid Bowl Base -->
    <path d="M260,365 C265,490 365,585 500,585 C635,585 735,490 740,365 C685,395 590,410 500,410 C410,410 315,395 260,365 Z" fill="url(#bowlGrad)"/>

    <!-- Bowl Surface Left Curved Highlight Glow -->
    <path d="M260,365 C265,490 365,585 500,585 C420,565 330,490 280,385 Z" fill="url(#bowlHighlight)"/>

    <!-- Bowl Rim Highlight -->
    <path d="M260,365 C320,395 405,410 500,410 C595,410 680,395 740,365 C725,378 625,418 500,418 C375,418 275,378 260,365 Z" fill="#a4e46a"/>
  </g>
</svg>
